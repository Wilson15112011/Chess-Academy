<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessAcademy | Learn the Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .chess-gradient {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
        }

        .board-wrap {
            width: min(78vw, 560px);
            position: relative;
            padding-left: 18px;
            padding-bottom: 18px;
        }

        .interactive-chess-board {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            overflow: hidden;
            border: 3px solid #d1a954;
            border-radius: 10px;
            box-shadow: 0 18px 45px rgba(0,0,0,.35);
        }

        .chess-square {
            border: 0;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: filter .12s ease, box-shadow .12s ease;
        }

        .chess-square.light { background: #eadfc5; }
        .chess-square.dark { background: #705c48; }

        .chess-square:hover { filter: brightness(1.08); }

        .chess-square.selected {
            box-shadow: inset 0 0 0 4px rgba(59,130,246,.9);
        }

        /* The king's square turns red while the king is in check. */
        .chess-square.king-in-check {
            background: #dc2626 !important;
            box-shadow: inset 0 0 0 4px #ef4444, 0 0 22px rgba(239,68,68,.65);
        }

        .chess-square.king-in-check .chess-piece {
            color: #ffffff !important;
            text-shadow: 0 0 8px rgba(0,0,0,.7);
        }

        .check-message {
            color: #f87171 !important;
            font-weight: 700;
        }

        .chess-square.last-move::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(250, 204, 21, .22);
            pointer-events: none;
        }

        .chess-square.legal::before {
            content: "";
            width: 22%;
            height: 22%;
            border-radius: 999px;
            background: rgba(30, 64, 175, .55);
            position: absolute;
            z-index: 1;
        }

        .chess-square.legal.capture::before {
            width: 72%;
            height: 72%;
            background: transparent;
            border: 5px solid rgba(30, 64, 175, .58);
        }

        .chess-square.castle-move::before {
            width: 32%;
            height: 32%;
            background: rgba(34, 197, 94, .75);
            box-shadow: 0 0 0 5px rgba(34, 197, 94, .18);
        }

        .chess-piece {
            font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", serif;
            font-size: clamp(32px, 7vw, 64px);
            line-height: 1;
            position: relative;
            z-index: 2;
            user-select: none;
            text-shadow: 0 2px 1px rgba(0,0,0,.35);
        }

        .chess-piece.w { color: #fffaf0; }
        .chess-piece.b { color: #151515; text-shadow: 0 2px 1px rgba(255,255,255,.15); }

        .chess-control-btn {
            font-size: 12px;
            font-weight: 600;
            padding: 8px 11px;
            border-radius: 9px;
            background: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            transition: background .15s ease, transform .15s ease;
        }
        .chess-control-btn:hover { background: #374151; transform: translateY(-1px); }
        .chess-control-btn:active { transform: translateY(0); }

        .files-labels {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            position: absolute;
            left: 18px;
            right: 0;
            bottom: 0;
            color: #9ca3af;
            font-size: 10px;
            text-align: center;
            pointer-events: none;
        }
        .ranks-labels {
            display: grid;
            grid-template-rows: repeat(8, 1fr);
            position: absolute;
            left: 0;
            top: 0;
            bottom: 18px;
            width: 16px;
            color: #9ca3af;
            font-size: 10px;
            text-align: center;
            pointer-events: none;
            align-items: center;
        }

        @media (max-width: 640px) {
            .board-wrap { width: min(94vw, 520px); }
        }
    </style>
</head>

                    <!-- Lessons List Section -->

                        <div class="grid gap-3">
                            <!-- Lesson 1 Link -->

                                <div class="flex items-start gap-4">

                                <button onclick="showVideoPage(1)" class="chess-gradient text-white text-xs font-semibold px-4 py-2.5 rounded-lg hover:opacity-90 transition-all shrink-0 w-full sm:w-auto text-center flex items-center justify-center gap-2">

                                <div class="flex items-start gap-4">

                        </div>

                        <!-- Real-time Lesson Quiz Block -->
                        <div class="glass-card rounded-2xl p-6 border border-gray-800/80 space-y-4">
                            <div class="flex items-center gap-2 border-b border-gray-800 pb-3">
                                <div class="w-7 h-7 rounded-md bg-blue-500/10 flex items-center justify-center text-blue-400 text-xs">
                                    <i class="fa-solid fa-lightbulb"></i>
                                </div>
                                <h3 class="text-sm font-bold tracking-wide uppercase text-gray-200">Lesson Checkpoint Quiz</h3>
                            </div>

                            <!-- Options Container -->
                            <div class="grid gap-2.5" id="quiz-options-box">
                                ${lesson.quiz.options.map((option, idx) => `
                                    <button onclick="checkAnswer(${option.isCorrect}, ${idx}, '${lesson.quiz.explanation.replace(/'/g, "\\'")}')" 
                                            class="quiz-opt-btn w-full text-left p-3.5 rounded-xl border border-gray-800 bg-gray-950/30 text-xs font-medium text-gray-300 hover:bg-gray-800/40 hover:border-gray-700 transition-all flex items-center justify-between group">
                                        <span>${option.text}</span>
                                        <i class="fa-regular fa-circle text-gray-600 group-hover:text-gray-400 text-[10px]"></i>
                                    </button>
                                `).join('')}
                            </div>

                            <!-- Live Feedback Placeholder -->
                            <div id="quiz-feedback-box" class="hidden p-4 rounded-xl text-xs leading-relaxed transition-all"></div>
                        </div>
                    </div>

                    <!-- Right Side: Sidebar Training Guidelines -->
                    <div class="space-y-4 lg:pt-10">
                        <div class="glass-card rounded-2xl p-5 border border-gray-800 space-y-4">

        }

        // ============================================================
        // Interactive Chess Board
        // Includes normal moves, captures, promotion and EN PASSANT.
        // En passant is available only immediately after an opponent
        // moves a pawn two squares from its starting rank.
        // ============================================================

        const PIECES = {
            w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
            b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
        };

        let chessState = null;

        function initialChessBoard() {
            return [
                ["br","bn","bb","bq","bk","bb","bn","br"],
                ["bp","bp","bp","bp","bp","bp","bp","bp"],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                [null,null,null,null,null,null,null,null],
                ["wp","wp","wp","wp","wp","wp","wp","wp"],
                ["wr","wn","wb","wq","wk","wb","wn","wr"]
            ];
        }

        function resetChessGame() {
            chessState = {
                board: initialChessBoard(),
                turn: "w",
                selected: null,
                lastMove: null,
                enPassant: null,
                castling: { wK: true, wQ: true, bK: true, bQ: true },
                message: "White to move",
                history: [],
                flipped: false
            };
            renderChessBoard();
        }

        function cloneChessState(state) {
            return {
                board: state.board.map(row => row.slice()),
                turn: state.turn,
                selected: null,
                lastMove: state.lastMove ? { from: {...state.lastMove.from}, to: {...state.lastMove.to} } : null,
                enPassant: state.enPassant ? {...state.enPassant} : null,
                castling: {...state.castling},
                message: state.message,
                history: [],
                flipped: state.flipped
            };
        }

        function undoChessMove() {
            if (!chessState || chessState.history.length === 0) {
                if (chessState) chessState.message = "There is no move to take back.";
                renderChessBoard();
                return;
            }
            const previous = chessState.history.pop();
            const remainingHistory = chessState.history;
            const orientation = chessState.flipped;
            chessState = cloneChessState(previous);
            chessState.history = remainingHistory;
            chessState.flipped = orientation;
            chessState.message = `${chessState.turn === "w" ? "White" : "Black"} to move — move taken back.`;
            renderChessBoard();
        }

        function toggleBoardRotation() {
            if (!chessState) return;
            chessState.flipped = !chessState.flipped;
            chessState.selected = null;
            renderChessBoard();
        }

        function squareName(r, c) {
            return "abcdefgh"[c] + (8 - r);
        }

        function inside(r, c) {
            return r >= 0 && r < 8 && c >= 0 && c < 8;
        }

        function colorOf(piece) {
            return piece ? piece[0] : null;
        }

        function typeOf(piece) {
            return piece ? piece[1] : null;
        }

        function sameColor(a, b) {
            return a && b && colorOf(a) === colorOf(b);
        }

        function canCastle(board, color, side) {
            if (!chessState) return false;

            // Custom ChessAcademy castling rule requested by the user:
            // the king may castle as long as the square where the king
            // LANDs is not attacked. We intentionally do NOT block castling
            // because the king is currently in check or because the king
            // passes through an attacked square.
            const row = color === "w" ? 7 : 0;
            const king = color + "k";
            const rook = color + "r";
            const right = color === "w"
                ? (side === "K" ? "wK" : "wQ")
                : (side === "K" ? "bK" : "bQ");

            if (!chessState.castling[right]) return false;
            if (board[row][4] !== king) return false;

            if (side === "K") {
                if (board[row][7] !== rook) return false;
                if (board[row][5] || board[row][6]) return false;
                // Only the king's destination square matters here.
                if (isSquareAttacked(board, row, 6, color === "w" ? "b" : "w")) return false;
                return true;
            }

            if (board[row][0] !== rook) return false;
            if (board[row][1] || board[row][2] || board[row][3]) return false;
            // Only the king's destination square matters here.
            // d1/d8 (the transit square) may be attacked under this custom rule.
            if (isSquareAttacked(board, row, 2, color === "w" ? "b" : "w")) return false;
            return true;
        }

        function pseudoMoves(board, r, c) {
            const piece = board[r][c];
            if (!piece) return [];
            const color = colorOf(piece);
            const type = typeOf(piece);
            const moves = [];

            const add = (nr, nc, special = null) => {
                if (!inside(nr, nc)) return;
                const target = board[nr][nc];
                // A king can never be captured directly; legal-move filtering
                // will stop a move that would capture the opposing king.
                if (!target || colorOf(target) !== color) {
                    moves.push({ r: nr, c: nc, special });
                }
            };

            if (type === "p") {
                const dir = color === "w" ? -1 : 1;
                const start = color === "w" ? 6 : 1;
                const one = r + dir;

                if (inside(one, c) && !board[one][c]) {
                    add(one, c);
                    const two = r + dir * 2;
                    if (r === start && !board[two][c]) {
                        add(two, c, "doublePawn");
                    }
                }

                for (const dc of [-1, 1]) {
                    const nr = r + dir, nc = c + dc;
                    if (inside(nr, nc) && board[nr][nc] &&
                        colorOf(board[nr][nc]) !== color) {
                        add(nr, nc);
                    }
                }

                // EN PASSANT is only available immediately after the
                // opponent makes a two-square pawn move.
                if (chessState && chessState.enPassant) {
                    const ep = chessState.enPassant;
                    if (ep.r === one && Math.abs(ep.c - c) === 1 && !board[ep.r][ep.c]) {
                        const adjacent = board[r][ep.c];
                        if (adjacent === (color === "w" ? "bp" : "wp")) {
                            moves.push({ r: ep.r, c: ep.c, special: "enPassant" });
                        }
                    }
                }
            }

            if (type === "n") {
                [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]
                    .forEach(([dr,dc]) => add(r+dr,c+dc));
            }

            if (type === "k") {
                for (let dr=-1; dr<=1; dr++) {
                    for (let dc=-1; dc<=1; dc++) {
                        if (dr || dc) add(r+dr,c+dc);
                    }
                }

                // Castling: king moves two squares toward the rook.
                if (c === 4) {
                    if (canCastle(board, color, "K")) moves.push({ r, c: 6, special: "castleK" });
                    if (canCastle(board, color, "Q")) moves.push({ r, c: 2, special: "castleQ" });
                }
            }

            const slide = (dirs) => {
                for (const [dr,dc] of dirs) {
                    let nr=r+dr, nc=c+dc;
                    while (inside(nr,nc)) {
                        if (!board[nr][nc]) {
                            moves.push({r:nr,c:nc});
                        } else {
                            if (colorOf(board[nr][nc]) !== color) {
                                moves.push({r:nr,c:nc});
                            }
                            break; // pieces block bishops, rooks and queens
                        }
                        nr += dr;
                        nc += dc;
                    }
                }
            };

            if (type === "b" || type === "q") {
                slide([[-1,-1],[-1,1],[1,-1],[1,1]]);
            }
            if (type === "r" || type === "q") {
                slide([[-1,0],[1,0],[0,-1],[0,1]]);
            }

            return moves;
        }

        // Returns true when a square is attacked by the given color.
        // This is deliberately separate from legal moves so a king cannot
        // move onto an attacked square.
        function isSquareAttacked(board, r, c, byColor) {
            const pawnRow = r + (byColor === "w" ? 1 : -1);
            for (const dc of [-1, 1]) {
                const pc = c + dc;
                if (inside(pawnRow, pc) && board[pawnRow][pc] === byColor + "p") {
                    return true;
                }
            }

            const knightOffsets = [
                [-2,-1],[-2,1],[-1,-2],[-1,2],
                [1,-2],[1,2],[2,-1],[2,1]
            ];
            for (const [dr,dc] of knightOffsets) {
                const nr=r+dr, nc=c+dc;
                if (inside(nr,nc) && board[nr][nc] === byColor + "n") return true;
            }

            for (let dr=-1; dr<=1; dr++) {
                for (let dc=-1; dc<=1; dc++) {
                    if (!dr && !dc) continue;
                    const nr=r+dr, nc=c+dc;
                    if (inside(nr,nc) && board[nr][nc] === byColor + "k") return true;
                }
            }

            const scan = (dirs, types) => {
                for (const [dr,dc] of dirs) {
                    let nr=r+dr, nc=c+dc;
                    while (inside(nr,nc)) {
                        const piece = board[nr][nc];
                        if (piece) {
                            if (colorOf(piece) === byColor && types.includes(typeOf(piece))) {
                                return true;
                            }
                            break;
                        }
                        nr += dr;
                        nc += dc;
                    }
                }
                return false;
            };

            if (scan([[-1,0],[1,0],[0,-1],[0,1]], ["r","q"])) return true;
            if (scan([[-1,-1],[-1,1],[1,-1],[1,1]], ["b","q"])) return true;

            return false;
        }

        function findKing(board, color) {
            for (let r=0; r<8; r++) {
                for (let c=0; c<8; c++) {
                    if (board[r][c] === color + "k") return {r,c};
                }
            }
            return null;
        }

        function isInCheck(board, color) {
            const king = findKing(board, color);
            if (!king) return true;
            return isSquareAttacked(board, king.r, king.c, color === "w" ? "b" : "w");
        }

        // Only moves that leave the moving side's own king safe are legal.
        // This prevents pinned pieces from moving, prevents the king from
        // moving into check, and forces a player in check to resolve it.
        function legalMoves(board, r, c) {
            const piece = board[r][c];
            if (!piece) return [];

            const color = colorOf(piece);
            const candidates = pseudoMoves(board, r, c);
            return candidates.filter(move => {
                const next = applyMove(board, {r,c}, move);
                return !isInCheck(next, color);
            });
        }

        function allLegalMoves(board, color) {
            const result = [];
            for (let r=0; r<8; r++) {
                for (let c=0; c<8; c++) {
                    if (colorOf(board[r][c]) !== color) continue;
                    for (const move of legalMoves(board, r, c)) {
                        result.push({from:{r,c}, move});
                    }
                }
            }
            return result;
        }

        function applyMove(board, from, move) {
            const next = board.map(row => row.slice());
            const piece = next[from.r][from.c];
            next[move.r][move.c] = piece;
            next[from.r][from.c] = null;

            if (move.special === "castleK") {
                next[from.r][5] = next[from.r][7];
                next[from.r][7] = null;
            } else if (move.special === "castleQ") {
                next[from.r][3] = next[from.r][0];
                next[from.r][0] = null;
            }

            if (move.special === "enPassant") {
                const capturedRow = from.r;
                next[capturedRow][move.c] = null;
            }

            // Automatic promotion to queen for a simple classroom board.
            if (typeOf(piece) === "p" && (move.r === 0 || move.r === 7)) {
                next[move.r][move.c] = colorOf(piece) + "q";
            }
            return next;
        }

        function renderChessBoard() {
            const boardEl = document.getElementById("interactive-chess-board");
            if (!boardEl || !chessState) return;

            boardEl.innerHTML = "";

            const filesEl = document.getElementById("files-labels");
            const ranksEl = document.getElementById("ranks-labels");
            if (filesEl) {
                const files = chessState.flipped ? ["h","g","f","e","d","c","b","a"] : ["a","b","c","d","e","f","g","h"];
                filesEl.innerHTML = files.map(f => `<span>${f}</span>`).join("");
            }
            if (ranksEl) {
                const ranks = chessState.flipped ? ["1","2","3","4","5","6","7","8"] : ["8","7","6","5","4","3","2","1"];
                ranksEl.innerHTML = ranks.map(r => `<span>${r}</span>`).join("");
            }

            const currentColor = chessState.turn;
            const inCheck = isInCheck(chessState.board, currentColor);
            const movesForTurn = allLegalMoves(chessState.board, currentColor);
            const checkmate = inCheck && movesForTurn.length === 0;
            const stalemate = !inCheck && movesForTurn.length === 0;

            for (let displayR=0; displayR<8; displayR++) {
                for (let displayC=0; displayC<8; displayC++) {
                    const r = chessState.flipped ? 7 - displayR : displayR;
                    const c = chessState.flipped ? 7 - displayC : displayC;
                    const sq = document.createElement("button");
                    sq.type = "button";
                    sq.className = "chess-square " + ((displayR+displayC)%2===0 ? "light" : "dark");
                    sq.dataset.r = r;
                    sq.dataset.c = c;

                    const piece = chessState.board[r][c];

                    // Highlight the king red whenever that side is in check.
                    if (piece === currentColor + "k" && inCheck) {
                        sq.classList.add("king-in-check");
                    }

                    if (piece) {
                        const span = document.createElement("span");
                        span.className = "chess-piece " + colorOf(piece);
                        span.textContent = PIECES[colorOf(piece)][typeOf(piece)];
                        sq.appendChild(span);
                    }

                    if (chessState.selected &&
                        chessState.selected.r === r &&
                        chessState.selected.c === c) {
                        sq.classList.add("selected");
                    }

                    if (chessState.lastMove &&
                        ((chessState.lastMove.from.r === r && chessState.lastMove.from.c === c) ||
                         (chessState.lastMove.to.r === r && chessState.lastMove.to.c === c))) {
                        sq.classList.add("last-move");
                    }

                    if (chessState.selected) {
                        const legal = legalMoves(
                            chessState.board,
                            chessState.selected.r,
                            chessState.selected.c
                        );
                        const targetMove = legal.find(m => m.r === r && m.c === c);
                        if (targetMove) {
                            sq.classList.add("legal");
                            if (piece) sq.classList.add("capture");
                            if (targetMove.special === "castleK" || targetMove.special === "castleQ") {
                                sq.classList.add("castle-move");
                            }
                        }
                    }

                    sq.addEventListener("click", () => handleChessSquare(r,c));
                    boardEl.appendChild(sq);
                }
            }

            const turn = document.getElementById("chess-turn");
            const msg = document.getElementById("chess-message");
            const status = document.getElementById("chess-status");

            if (turn) turn.textContent = currentColor === "w" ? "White" : "Black";

            if (checkmate) {
                chessState.message = `CHECKMATE! ${currentColor === "w" ? "Black" : "White"} wins.`;
            } else if (stalemate) {
                chessState.message = "STALEMATE! There are no legal moves.";
            } else if (inCheck) {
                chessState.message = `${currentColor === "w" ? "White" : "Black"} is in CHECK — move the king, block the check, or capture the checking piece.`;
            }

            if (msg) {
                msg.textContent = chessState.message;
                msg.classList.toggle("check-message", inCheck);
            }

            if (status) {
                status.textContent = checkmate ? "Checkmate" : (stalemate ? "Stalemate" : (inCheck ? "CHECK" : "Normal"));
                status.className = inCheck
                    ? "font-bold text-red-400"
                    : "font-bold text-green-400";
            }
        }

        function handleChessSquare(r, c) {
            if (!chessState) return;

            const piece = chessState.board[r][c];

            if (chessState.selected) {
                const from = chessState.selected;

                // IMPORTANT: use legalMoves, not pseudoMoves.
                // A pinned bishop/rook/queen cannot expose its own king.
                // A king cannot move into check.
                // If in check, only moves that remove the check are allowed.
                const legal = legalMoves(chessState.board, from.r, from.c);
                const move = legal.find(m => m.r === r && m.c === c);

                if (move) {
                    // Save the complete position so Undo restores castling and en-passant rights too.
                    const snapshot = cloneChessState(chessState);
                    snapshot.history = [];
                    chessState.history.push(snapshot);
                    const movingPiece = chessState.board[from.r][from.c];
                    const capturedPiece = chessState.board[move.r][move.c];
                    const wasEnPassant = move.special === "enPassant";
                    const wasCastle = move.special === "castleK" || move.special === "castleQ";

                    // Once a king or rook moves, that side loses the corresponding castling right.
                    if (movingPiece === "wk") { chessState.castling.wK = false; chessState.castling.wQ = false; }
                    if (movingPiece === "bk") { chessState.castling.bK = false; chessState.castling.bQ = false; }
                    if (movingPiece === "wr" && from.r === 7 && from.c === 7) chessState.castling.wK = false;
                    if (movingPiece === "wr" && from.r === 7 && from.c === 0) chessState.castling.wQ = false;
                    if (movingPiece === "br" && from.r === 0 && from.c === 7) chessState.castling.bK = false;
                    if (movingPiece === "br" && from.r === 0 && from.c === 0) chessState.castling.bQ = false;

                    // Capturing an unmoved rook also removes its castling right.
                    if (capturedPiece === "wr" && move.r === 7 && move.c === 7) chessState.castling.wK = false;
                    if (capturedPiece === "wr" && move.r === 7 && move.c === 0) chessState.castling.wQ = false;
                    if (capturedPiece === "br" && move.r === 0 && move.c === 7) chessState.castling.bK = false;
                    if (capturedPiece === "br" && move.r === 0 && move.c === 0) chessState.castling.bQ = false;

                    chessState.board = applyMove(chessState.board, from, move);
                    chessState.lastMove = { from: {...from}, to: {r,c} };

                    // En passant is available for exactly one opponent move.
                    chessState.enPassant = null;
                    if (typeOf(movingPiece) === "p" && Math.abs(r - from.r) === 2) {
                        chessState.enPassant = { r: (r + from.r) / 2, c };
                    }

                    chessState.turn = chessState.turn === "w" ? "b" : "w";
                    chessState.selected = null;

                    if (wasEnPassant) {
                        chessState.message = "En passant! The pawn was captured behind the destination square.";
                    } else if (wasCastle) {
                        chessState.message = `${chessState.turn === "w" ? "White" : "Black"} to move — castling completed.`;
                    } else {
                        chessState.message = `${chessState.turn === "w" ? "White" : "Black"} to move`;
                    }

                    renderChessBoard();
                    return;
                }

                // Allow selecting another piece of the side to move.
                if (piece && colorOf(piece) === chessState.turn) {
                    chessState.selected = {r,c};
                    chessState.message = `${chessState.turn === "w" ? "White" : "Black"} selected ${PIECES[colorOf(piece)][typeOf(piece)]}.`;
                } else {
                    chessState.selected = null;
                    chessState.message = `${chessState.turn === "w" ? "White" : "Black"} to move`;
                }
            } else if (piece && colorOf(piece) === chessState.turn) {
                chessState.selected = {r,c};

                if (legalMoves(chessState.board, r, c).length === 0) {
                    chessState.message = "That piece has no legal moves.";
                } else {
                    chessState.message = `${chessState.turn === "w" ? "White" : "Black"} selected ${PIECES[colorOf(piece)][typeOf(piece)]}.`;
                }
            }

            renderChessBoard();
        }

        function showChessBoard() {
            container.innerHTML = `
                <div class="max-w-6xl w-full py-5">
                    <div class="flex flex-col lg:flex-row gap-7 items-start">
                        <div class="w-full lg:w-auto">
                            <div class="mb-4">
                                <button onclick="showDashboard()" class="inline-flex items-center gap-2 text-xs text-gray-400 hover:text-white font-medium transition-colors">
                                    <i class="fa-solid fa-arrow-left text-[10px]"></i>
                                    Return to Lessons
                                </button>
                            </div>

                            <div class="glass-card rounded-2xl p-4 sm:p-6 border border-gray-800">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <h1 class="text-2xl font-bold text-white">Interactive Chess Board</h1>
                                        <p class="text-xs text-gray-400 mt-1">Click a piece, then click its destination.</p>
                                    </div>
                                    <div class="flex flex-wrap gap-2 justify-end">
                                        <button onclick="undoChessMove()" class="chess-control-btn">
                                            <i class="fa-solid fa-arrow-rotate-left mr-1"></i> Take Back
                                        </button>
                                        <button onclick="toggleBoardRotation()" class="chess-control-btn">
                                            <i class="fa-solid fa-arrows-rotate mr-1"></i> Rotate Board
                                        </button>
                                        <button onclick="resetChessGame()" class="chess-control-btn">
                                            <i class="fa-solid fa-rotate-left mr-1"></i> Reset
                                        </button>
                                    </div>
                                </div>

                                <div class="flex justify-center">
                                    <div class="board-wrap">
                                        <div id="files-labels" class="files-labels"></div>
                                        <div id="ranks-labels" class="ranks-labels"></div>
                                        <div id="interactive-chess-board" class="interactive-chess-board" aria-label="Interactive chess board"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <aside class="w-full lg:w-80 space-y-4 lg:mt-10">
                            <div class="glass-card rounded-2xl p-5 border border-gray-800">
                                <div class="flex items-center justify-between">
                                    <span class="text-xs uppercase tracking-wider text-gray-500">Turn</span>
                                    <span id="chess-turn" class="font-bold text-blue-400">White</span>
                                </div>
                                <div class="flex items-center justify-between mt-3">
                                    <span class="text-xs uppercase tracking-wider text-gray-500">Status</span>
                                    <span id="chess-status" class="font-bold text-green-400">Normal</span>
                                </div>
                                <p id="chess-message" class="text-sm text-gray-300 mt-3">White to move</p>
                            </div>

                            <div class="glass-card rounded-2xl p-5 border border-gray-800">
                                <h3 class="text-sm font-bold text-white mb-2">
                                    <i class="fa-solid fa-wand-magic-sparkles text-blue-400 mr-1"></i>
                                    En passant
                                </h3>
                                <p class="text-xs text-gray-400 leading-relaxed">
                                    If a pawn moves two squares forward from its starting rank and lands beside an enemy pawn,
                                    that enemy pawn may capture it as if it had moved only one square. The capture must happen immediately.
                                </p>
                                <p class="text-xs text-gray-400 leading-relaxed mt-3">
                                    <strong class="text-gray-200">Castling:</strong> the king can move two squares toward an unmoved rook when neither piece has moved,
                                    the squares between them are empty, the king is not in check, and the king does not cross an attacked square.
                                </p>
                            </div>

                            <div class="glass-card rounded-2xl p-5 border border-gray-800">
                                <h3 class="text-sm font-bold text-white mb-3">Try this en passant example</h3>
                                <ol class="text-xs text-gray-400 space-y-2 list-decimal pl-4">
                                    <li>Move White's e-pawn from e2 to e4.</li>
                                    <li>Move Black's d-pawn from d7 to d5.</li>
                                    <li>Move White's e-pawn from e4 to e5.</li>
                                    <li>Move Black's f-pawn from f7 to f5.</li>
                                    <li>White can now click e5, then f6 — that's en passant.</li>
                                </ol>
                            </div>
                        </aside>
                    </div>
                </div>
            `;
            resetChessGame();
        }

        // Quiz State Evaluation Engine
        function checkAnswer(isCorrect, selectedIdx, explanationText) {
            const feedbackBox = document.getElementById('quiz-feedback-box');
            const optionButtons = document.querySelectorAll('.quiz-opt-btn');

            // Lock all quiz buttons to prevent changing choice after evaluation
            optionButtons.forEach((btn, index) => {
                btn.disabled = true;
                const icon = btn.querySelector('i');
                if (index === selectedIdx) {
                    if (isCorrect) {
                        btn.classList.replace('border-gray-800', 'border-green-500/30');
                        btn.classList.add('bg-green-500/5');
                        icon.className = "fa-solid fa-circle-check text-green-400 text-[11px]";
                    } else {
                        btn.classList.replace('border-gray-800', 'border-red-500/30');
                        btn.classList.add('bg-red-500/5');
                        icon.className = "fa-solid fa-circle-xmark text-red-400 text-[11px]";
                    }
                }
            });

            // Reveal customized feedback context alert box
            feedbackBox.classList.remove('hidden', 'bg-green-500/10', 'text-green-400', 'border-green-500/20', 'bg-red-500/10', 'text-red-400', 'border-red-500/20');
            
            if (isCorrect) {
                feedbackBox.className = "p-4 rounded-xl text-xs leading-relaxed border bg-green-500/5 text-green-400 border-green-500/20 flex gap-3 items-start";
                feedbackBox.innerHTML = `
                    <i class="fa-solid fa-circle-check mt-0.5 text-sm"></i>
                    <div><span class="font-bold block mb-0.5">Excellent Match Analysis!</span> ${explanationText}</div>
                `;
            } else {
                feedbackBox.className = "p-4 rounded-xl text-xs leading-relaxed border bg-red-500/5 text-red-400 border-red-500/20 flex gap-3 items-start";
                feedbackBox.innerHTML = `
                    <i class="fa-solid fa-circle-xmark mt-0.5 text-sm"></i>
                    <div><span class="font-bold block mb-0.5">Incorrect Move.</span> Re-evaluate the board rules, look carefully over the study notes, and try another option on your next match setup!</div>
                `;
            }
        }

        // Initialize setup
        showDashboard();
    </script>
